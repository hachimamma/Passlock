[package]
name = "passlock"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
crossterm = "0.27"
ratatui = "0.26"
dirs = "5.0"
totp-lite = "2.0"
base32 = "0.4"
rpassword = "7.3"

# Daemon dependencies
tokio = { version = "1", features = ["full"] }
global-hotkey = "0.6"
eframe = "0.31"
egui = "0.31"
notify-rust = "4"
sysinfo = "0.31"
daemonize = "0.5"

# Platform-specific
[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true